<!doctype html>
<html lang="en" data-zoom="month" data-palette="paired" data-view="report">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PACT - report</title>
<meta name="description" content="PACT: the plan's report, over the plan period.">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- The same top bar the plan mounts, from public/lib/topbar.mjs. The board
       skeleton is the plan's too, less its Projects rail: a rail holds
       Projects to drag onto a timeline, and a report has no timeline to drop
       one on, so neither the rail nor the control that folds it is mounted
       here and the report's content takes the whole board. public/app.js
       draws the report's own content into #tl instead of the grid. -->
  <header class="topbar" id="topbar"></header>

  <main class="board" id="board">
    <div class="scroller" id="scroller">
      <div class="tl" id="tl">
        <!-- the report's own content is drawn from the plan -->
      </div>
    </div>

    <div class="minimap" id="minimap" role="group" aria-label="Timeline overview" hidden>
      <svg class="minimap__svg" viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true">
        <path class="minimap__fill" d=""></path>
        <path class="minimap__over" d=""></path>
      </svg>
      <div class="minimap__window" aria-hidden="true"></div>
    </div>
  </main>

  <div class="panel-layer" id="panel-layer" hidden></div>

  <noscript>
    <p class="noscript">PACT needs JavaScript to draw the report.</p>
  </noscript>

  <script type="module" src="app.js"></script>
</body>
</html>
