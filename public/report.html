<!doctype html>
<html lang="en" data-zoom="month" data-palette="paired" data-view="report">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PACT - report</title>
<meta name="description" content="PACT: the plan's report, over the plan period.">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- The same top bar the plan mounts, from public/lib/topbar.mjs. The board
       skeleton is the plan's too, and so is its rail: the same panel at the same
       width, folded by the same control and remembering the same collapsed
       state, listing the report's own views in place of Projects. public/app.js
       draws that list and the selected view's content into #tl; the report has
       no timeline, so it has nothing to drop a Project onto. -->
  <header class="topbar" id="topbar"></header>

  <main class="board" id="board">
    <aside class="stack" id="stack" aria-label="Report views">
      <div class="stack__head">
        <h1 class="stack__title">Views</h1>
      </div>
      <ul class="stack__list" id="report-views"></ul>
    </aside>

    <button type="button" class="rail-toggle" id="rail-toggle"
      aria-controls="stack" aria-expanded="true" aria-label="Collapse Report views" title="Collapse Report views">
      <svg class="rail-toggle__glyph" viewBox="0 0 16 16" fill="none" stroke="currentColor"
        stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path class="rail-toggle__path" d="M10 3 5 8l5 5"/>
      </svg>
    </button>

    <div class="scroller" id="scroller">
      <div class="tl" id="tl">
        <!-- the report's own content is drawn from the plan -->
      </div>
    </div>

    <div class="minimap" id="minimap" role="group" aria-label="Timeline overview" hidden>
      <svg class="minimap__svg" viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true">
        <path class="minimap__fill" d=""></path>
        <path class="minimap__over" d=""></path>
      </svg>
      <div class="minimap__window" aria-hidden="true"></div>
    </div>
  </main>

  <div class="panel-layer" id="panel-layer" hidden></div>

  <noscript>
    <p class="noscript">PACT needs JavaScript to draw the report.</p>
  </noscript>

  <script type="module" src="app.js"></script>
</body>
</html>
